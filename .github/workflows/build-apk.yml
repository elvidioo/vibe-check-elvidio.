name: Unzip project
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract
        run: |
          Z=vibe-check-elvidio-supabase-v10-connecte.zip
          mkdir /tmp/x
          unzip -q "$Z" -d /tmp/x
          if [ "$(ls -A /tmp/x | wc -l)" -eq 1 ] && [ -d "/tmp/x/$(ls -A /tmp/x)" ]; then
            SRC="/tmp/x/$(ls -A /tmp/x)"
          else
            SRC=/tmp/x
          fi
          rm "$Z"
          cp -r "$SRC"/. .
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Extract project" || exit 0
          git push
